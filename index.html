<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Weather Dashboard</h1>
    <p class="subtitle">"Explore weather conditions around the world"</p>
        <p class="subtitle">Check the weather in your city</p>
        <form id="searchForm">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
                required
            >
            <button type="submit">Search</button>
        </form>
        <div id="weatherResult" class="weather-card">
            <h2>Welcome!</h2>
            <p>Search for a city to see its weather...</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
